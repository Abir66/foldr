[project]
name = "foldr-backend"
version = "0.1.0"
description = "foldr backend: config, agent runs over SSE, budgets"
requires-python = ">=3.12"
dependencies = [
    "origami",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
origami = { path = "../origami" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
