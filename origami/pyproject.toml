[project]
name = "origami"
version = "0.1.0"
description = "Step-by-step flat origami fold simulator (layer tracking, PNG steps, FOLD export)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
origami = "origami.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["slow: minutes-long checks (menu reachability); skipped unless ORIGAMI_SLOW=1"]
